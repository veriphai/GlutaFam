  shimmer: ^3.0.0
  chat_bubbles: ^1.7.0
  # flutter_tex: ^4.0.9
  # icons_plus: ^5.0.0
  # multi_dropdown: ^3.0.1
  dropdown_button2: ^2.3.9
  bubble_box: ^0.5.3
  animated_text_kit: ^4.2.2
  gpt_markdown: ^1.0.9
  flutter_markdown_latex: ^0.3.4
  # flutter_markdown: ^0.6.10  # REMOVED: Package discontinued, replaced by flutter_markdown_latex
  lottie: ^3.1.3
  photo_view: ^0.15.0
  # wakelock_plus: ^1.3.0
  sign_in_with_apple: ^7.0.1
