  shared_preferences: ^2.2.3
  smooth_page_indicator: ^1.1.0
  google_fonts: ^8.1.0
  firebase_auth: ^6.0.2
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1

  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.0
