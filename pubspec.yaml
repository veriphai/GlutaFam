dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - assets/Final Audio Onboarding.mp3
    - assets/correct_answer.mp3
    - assets/incorrect_answer.mp3
    - assets/jumpSound.mp3
    - assets/levelComplete.mp3
    # Brand logo — the "magical box" illustration used both as the
    # native-splash image AND as the centrepiece of
    # WowFirstHowNextScreen. Bundling it explicitly so Image.asset can
    # load it at runtime (flutter_native_splash's own image directive
    # isn't enough — that path only matters during the native splash
    # phase).
    - assets/howwow-logo.png
    # The HowWow wordmark icon (the native-splash / app icon). Bundled so
    # Image.asset can render it at runtime — used as the core of the
    # "building your universe" orbit on BuildingUniverseScreen.
    - assets/howwow-icon.png
    # `assets/videos/` keeps the small home-screen onboarding loop
    # (intro_loop.mp4 ~1.7 MB + intro_first_frame.jpg ~215 KB) — they're
    # hot-path and must paint instantly. Lesson cutscene videos
    # (restore_earth intro/outro etc.) are served from S3 and streamed
    # progressively via VideoPlayerController.networkUrl — see
    # MissionVideoScreen for the http* prefix detection.
    - assets/videos/
    # Locally-bundled Poppins fonts. The google_fonts package auto-discovers
    # any *.ttf placed under this exact folder name (`google_fonts/`) and
    # uses them in preference to network downloads. Combined with
    # `GoogleFonts.config.allowRuntimeFetching = false` in main.dart this
    # eliminates the cold-start font-flash on the welcome screen.
    - google_fonts/
    - lib/assets/avatars/
    - lib/assets/achievements/
    - lib/assets/leagues/
    - lib/assets/animations/
    - lib/screens/testing.html
    # Top-level PNGs (profession / world cards: astronaut.png, ai_engineer.png,
    # space_world.png, satellite_engineer.png, etc.) stay bundled. Subfolders
    # for the 10 Satellite Engineer activities are NOT declared — those images
    # are served from S3 (https://the-how-wow-prod.s3.ap-south-1.amazonaws.com/
    # activities/<id>/...) and precached at lesson-start via
    # lib/utils/s3_assets.dart + the manifests below.
    - assets/images/
    # Voltix — the electricity-concept companion mascot (8 moods). Bundled
    # (not S3) because it renders instantly and is shared across every episode.
    - assets/images/voltix/
    # Helix — the de-extinction companion mascot (5 moods used by the Prologue).
    - assets/images/helix/
    # Pre-rendered collectible card faces (premium hero art for specific cards).
    - assets/images/collectibles/
    # Episode-board art: the case-briefing dossier + activity backdrop + (subfolder)
    # the pre-kept "perfect" evidence frames. Folder decls aren't recursive, so
    # both the parent and the evidence/ subfolder are listed.
    - assets/images/episode_board/
    - assets/images/episode_board/evidence/
    # Hand-Crank Lamp audio — Voltix VO (voltix_01..18.mp3) + BGM. Bundled
    # locally (not S3) for <100ms voice latency on kid feedback.
    - assets/sounds/hand_crank_lamp/
    # Trace It Back audio — Voltix VO (voltix_01..26.mp3) + BGM.
    - assets/sounds/trace_it_back/
    # Per-activity asset manifests consumed by precacheActivityImages() +
    # precacheActivityAudio(). Regenerate via
    # tools/generate_activity_manifests.sh whenever sprites or sounds are
    # added/renamed for one of the 11 activities.
    - assets/manifests/
    # Activity audio (Orbit voice-over, BGM, SFX — ~129 MB across the 11
    # activities) is NOT bundled. It lives on S3 at
    # activities/<id>/audio/<path> (upload via
    # tools/upload_activity_audio_to_s3.sh) and is downloaded to the app
    # cache dir at lesson start by precacheActivityAudio() so voice still
    # plays with file-local latency — see lib/utils/s3_audio.dart.
    # Only the small app-wide SFX above (correct_answer.mp3 etc.) stay
    # bundled.

flutter_native_splash:
  # Starry CosmicBackground render (same look as the login screen) — regenerate
  # with tools/generate_splash_background.py if the career theme changes.
  background_image: assets/splash-background.png
  # image: assets/howwow-logo.png  # (old rocket-box illustration)
  image: assets/howwow-icon.png
  # Android 12+ uses the system splash (centered icon on a solid color);
  # full-bleed background images aren't supported there. The OS also MASKS
  # this icon into a circle/squircle and only shows the inner ~2/3, so we
  # feed it a pre-padded variant where the wordmark is shrunk to fit inside
  # that safe zone (regenerate with tools/generate_splash_background.py logic
  # / the padded-icon step). Using the full-bleed howwow-icon.png here clips
  # ~28% of the logo. The un-padded full logo is still used for iOS and
  # Android <=11 below, which don't mask.
  android_12:
    color: "#07162F" # CareerColors.bgMid
    image: assets/howwow-icon-splash.png
  android: true
  ios: true
  fullscreen: true # Optional: Set to true for full-screen splash
  android_gravity: center # Gravity for the splash image on Android (center)