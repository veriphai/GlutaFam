name: eureka_app
description: "Bond constructively with your child"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.1+12

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0

  carousel_slider: ^5.0.0
  http: ^1.2.0
  url_launcher: ^6.2.5
  flutter_local_notifications: ^9.0.0
  timezone: ^0.8.0
  device_info_plus: ^9.1.2
  shared_preferences: ^2.2.3
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.2.1
  firebase_auth: ^5.1.2
  firebase_core: ^3.2.0
  firebase_messaging: ^15.1.3

  permission_handler: ^11.3.1
  web_socket_channel: ^3.0.0
  flutter_secure_storage: ^4.2.1
  audioplayers: ^6.1.0
  marquee: ^2.2.3
  webview_flutter: ^4.0.7
  webview_flutter_android: ^3.16.7
  webview_flutter_wkwebview: ^3.14.0
  fluttertoast: ^8.2.8
  share_plus: ^10.0.3
  google_sign_in: ^6.2.0
  intl_phone_number_input: ^0.7.4
  firebase_analytics: ^11.3.3
  flutter_native_splash: ^2.4.1
  libphonenumber_plugin: ^0.3.3
  pdfx: ^2.6.0
  flutter_sound: ^9.6.0
  flutter_audio_waveforms: ^1.2.1+8
  path_provider: ^2.1.4
  http_parser: ^4.0.2
  audio_session: ^0.1.21
  # miniplayer: ^1.0.1
  just_audio: ^0.9.20
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.1
  firebase_dynamic_links: ^6.0.10
  video_player: ^2.9.2
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - assets/Final Audio Onboarding.mp3

flutter_native_splash:
  color: "#000000" # Background color
  image: assets/logo-latest.png # Path to your logo or splash image
  android: true
  ios: true
  fullscreen: true # Optional: Set to true for full-screen splash
  android_gravity: center # Gravity for the splash image on Android (center)
